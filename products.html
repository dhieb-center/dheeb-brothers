<title>دليل المنتجات - مجموعة ذيب إخوان التجارية</title>

:root {
    --burgundy: #4a1118;
    --gold: #c9a45c;
    --bg: #f4f6f9;
}

* {
    box-sizing: border-box;
}

body {
    background: var(--bg);
    font-family: 'Cairo', sans-serif;
    margin: 0;
    padding: 10px;
    padding-bottom: 95px;
}

/* HEADER */

.header {
    background: var(--burgundy);
    color: white;
    padding: 12px;
    border-radius: 10px;
    border-bottom: 4px solid var(--gold);
    margin-bottom: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 5px;
}

.header h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 800;
}

.header a {
    color: var(--gold);
    text-decoration: none;
    font-size: 12px;
    font-weight: bold;
    white-space: nowrap;
}

/* SEARCH */

.search-box {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border: 2px solid var(--gold);
    border-radius: 8px;
    font-family: 'Cairo';
    font-size: 15px;
    outline: none;
}

/* CATEGORIES */

.categories-bar {
    display: flex;
    overflow-x: auto;
    gap: 8px;
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 1px dashed #ccc;
}

.category-btn {
    background: white;
    color: var(--burgundy);
    border: 1px solid var(--gold);
    padding: 7px 15px;
    border-radius: 30px;
    font-family: 'Cairo';
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
    font-size: 12px;
}

.category-btn.active {
    background: var(--burgundy);
    color: var(--gold);
}
