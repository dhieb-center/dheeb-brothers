<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب الزبائن - سنتر الذيب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #4a1118; font-family: 'Cairo', sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; padding: 20px;
        }
        .login-box { 
            background-color: #fff; padding: 40px 30px; border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; 
            width: 100%; max-width: 450px; 
        }
        .login-box h2 { color: #4a1118; margin-top: 0; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: right; }
        .input-group label { display: block; color: #333; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .input-group input { 
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; 
            box-sizing: border-box; font-size: 16px; font-family: 'Cairo', sans-serif;
        }
        .btn { 
            width: 100%; padding: 12px; background-color: #c9a45c; color: white; 
            border: none; border-radius: 8px; font-size: 18px; font-weight: bold; 
            cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn:hover { background-color: #b08d4a; }
        .switch-form { margin-top: 20px; font-size: 14px; }
        .switch-form a { color: #4a1118; font-weight: bold; text-decoration: none; cursor: pointer;}
        .hidden { display: none; }
        #error-msg, #success-msg { margin-top: 15px; font-weight: bold; font-size: 14px; display: none; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2 id="form-title">إنشاء حساب زبون</h2>
        
        <!-- نموذج التسجيل -->
        <form id="registerForm">
            <div class="input-group">
                <label>الاسم الكامل</label>
                <input type="text" id="reg-name" placeholder="الاسم الثلاثي..." required>
            </div>
            <div class="input-group">
                <label>رقم الهاتف (بدون رمز الدولة)</label>
                <input type="tel" id="reg-phone" placeholder="09xxxxxxxx" required pattern="[0-9]{10}">
            </div>
            <div class="input-group">
                <label>تاريخ الميلاد</label>
                <input type="date" id="reg-dob" required>
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="reg-password" placeholder="********" required minlength="6">
            </div>
            <button type="submit" class="btn" id="reg-btn">إنشاء الحساب</button>
        </form>

        <!-- نموذج الدخول (مخفي بالبداية) -->
        <form id="loginForm" class="hidden">
            <div class="input-group">
                <label>رقم الهاتف</label>
                <input type="tel" id="log-phone" placeholder="09xxxxxxxx" required>
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="log-password" placeholder="********" required>
            </div>
            <button type="submit" class="btn" id="log-btn">تسجيل الدخول</button>
        </form>

        <p id="error-msg" style="color: red;"></p>
        <p id="success-msg" style="color: green;"></p>

        <div class="switch-form">
            <span id="switch-text">لديك حساب بالفعل؟ </span>
            <a id="switch-link" onclick="toggleForm()">سجل دخولك من هنا</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        // نستخدم المصادقة عبر البريد (لكننا سنستخدم الرقم كبريد وهمي)
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDlT3aXjE7Bg6a2gx4YSGH61ybW0sdQS2g",
            authDomain: "dheeb-brothers.firebaseapp.com",
            projectId: "dheeb-brothers",
            storageBucket: "dheeb-brothers.firebasestorage.app",
            messagingSenderId: "419429945832",
            appId: "1:419429945832:web:6cf5bc22ec496db576945d",
            measurementId: "G-GBRL9YKWKE"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const registerForm = document.getElementById('registerForm');
        const loginForm = document.getElementById('loginForm');
        const formTitle = document.getElementById('form-title');
        const switchText = document.getElementById('switch-text');
        const switchLink = document.getElementById('switch-link');
        const errorMsg = document.getElementById('error-msg');
        const successMsg = document.getElementById('success-msg');

        let isLoginMode = false;

        window.toggleForm = function() {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                formTitle.innerText = "تسجيل دخول الزبائن";
                registerForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
                switchText.innerText = "ليس لديك حساب؟ ";
                switchLink.innerText = "أنشئ حساباً جديداً";
            } else {
                formTitle.innerText = "إنشاء حساب زبون";
                registerForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                switchText.innerText = "لديك حساب بالفعل؟ ";
                switchLink.innerText = "سجل دخولك من هنا";
            }
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
        }

        // عملية التسجيل
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            const name = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;
            const dob = document.getElementById('reg-dob').value;
            const password = document.getElementById('reg-password').value;

            // التحقق من صحة رقم الهاتف (10 أرقام)
            if (phone.length !== 10 || isNaN(phone)) {
                errorMsg.innerText = "الرجاء إدخال رقم هاتف صحيح مكون من 10 أرقام.";
                errorMsg.style.display = 'block';
                return;
            }

            // إنشاء "بريد وهمي" من رقم الهاتف عشان Firebase يقبله
            const fakeEmail = phone + "@dheeb.com";

            try {
                // 1. إنشاء الحساب
                const userCredential = await createUserWithEmailAndPassword(auth, fakeEmail, password);
                const user = userCredential.user;

                // 2. حفظ بيانات الزبون بقاعدة البيانات
                await setDoc(doc(db, "customers", user.uid), {
                    fullName: name,
                    phone: phone,
                    dob: dob,
                    isVerified: false, // حالة التوثيق (قيد الانتظار)
                    createdAt: new Date()
                });

                successMsg.innerText = "تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول برقم هاتفك.";
                successMsg.style.display = 'block';
                registerForm.reset();

            } catch (error) {
                if (error.code === 'auth/email-already-in-use') {
                    errorMsg.innerText = "رقم الهاتف هذا مسجل مسبقاً.";
                } else if (error.code === 'auth/weak-password') {
                    errorMsg.innerText = "كلمة المرور ضعيفة جداً (يجب أن تكون 6 أحرف على الأقل).";
                } else {
                    errorMsg.innerText = "حدث خطأ أثناء التسجيل: " + error.message;
                }
                errorMsg.style.display = 'block';
            }
        });

        // عملية الدخول
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            const phone = document.getElementById('log-phone').value;
            const password = document.getElementById('log-password').value;
            const fakeEmail = phone + "@dheeb.com";

            try {
                const userCredential = await signInWithEmailAndPassword(auth, fakeEmail, password);
                const user = userCredential.user;

                // جلب بيانات الزبون
                const docRef = doc(db, "customers", user.uid);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const customerData = docSnap.data();
                    localStorage.setItem('customerName', customerData.fullName);
                    localStorage.setItem('isVerified', customerData.isVerified);
                    localStorage.setItem('customerPhone', customerData.phone);
                    successMsg.innerText = "تم تسجيل الدخول بنجاح! جاري تحويلك...";
                    successMsg.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    errorMsg.innerText = "لم يتم العثور على بيانات الزبون.";
                    errorMsg.style.display = 'block';
                }

            } catch (error) {
                errorMsg.innerText = "رقم الهاتف أو كلمة المرور غير صحيحة.";
                errorMsg.style.display = 'block';
            }
        });
    </script>

</body>
</html>
